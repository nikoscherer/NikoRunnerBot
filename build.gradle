buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        // Note for FTC Teams: Do not modify this yourself.
        classpath 'com.android.tools.build:gradle:7.2.0'
    }
}

// This is now required because aapt2 has to be downloaded from the
// google() repository beginning with version 3.2 of the Android Gradle Plugin
allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

repositories {
    mavenCentral()

    maven {
        name = "nikorunnerlib";
        url = uri("https://maven.pkg.github.com/nikoscherer/nikorunnerlib");
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("nikoscherer")
            password = project.findProperty("gpr.key") ?: System.getenv("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")
        }
    }
}
